<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jay Kapadiya — AI/ML Engineer</title>
<meta name="description" content="Jay Kapadiya. AI/ML Engineer building backend systems and deployment pipelines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --bg:#050506;
    --bg-panel:#0f0607;
    --bg-panel-2:#1a0709;
    --text:#eae6dc;
    --text-muted:#a08a8a;
    --text-dim:#5b4040;
    --accent:#8a0303;
    --accent-soft:#c1121f;
    --accent-dim:#250304;
    --line:rgba(234,230,220,0.10);
    --line-strong:rgba(234,230,220,0.20);
    --font-display:'Mantina Regular','Mantina','Cinzel',serif;
    --font-main:'Mantina Regular','Mantina','Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;

    --fs-micro:clamp(10px,2.6vw,12px);
    --fs-small:clamp(11.5px,3vw,13px);
    --fs-body:clamp(13.5px,3.4vw,15px);
    --fs-body-lg:clamp(15px,3.6vw,18px);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overscroll-behavior:none;
  }
  html{
    /* real scrolling is fully replaced by the horizontal slide controller */
    overflow:hidden;
  }
  ::selection{background:var(--accent);color:#fff5f5;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-main);
    overflow:hidden;
    position:fixed;
    inset:0;
    width:100%;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  body::before{
    content:"";
    position:fixed;inset:0;z-index:-4;pointer-events:none;
    background:
      linear-gradient(rgba(234,230,220,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(234,230,220,0.035) 1px, transparent 1px);
    background-size:72px 72px;
    mask-image:linear-gradient(180deg, transparent, #000 18%, #000 78%, transparent);
  }
  .cursor-aura{
    position:fixed;left:0;top:0;width:360px;height:360px;z-index:30;pointer-events:none;
    border-radius:50%;
    background:radial-gradient(circle, rgba(138,3,3,0.26), rgba(138,3,3,0.08) 34%, transparent 68%);
    mix-blend-mode:screen;opacity:0;transform:translate(-50%,-50%);
  }
  .hf{font-family:var(--font-display);}
  .mono{font-family:var(--font-mono);}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  /* ---------- preloader ---------- */
  #preloader{
    position:fixed;inset:0;z-index:999;
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
  }
  #preloader .mark{
    font-family:var(--font-display);font-size:clamp(20px,3.4vw,30px);font-weight:600;
    letter-spacing:0.32em;color:var(--text);opacity:0;text-indent:0.32em;
  }
  #preloader .rule{
    margin-top:22px;height:1px;width:0;background:var(--accent);
  }
  .audio-gate{
    position:fixed;inset:0;z-index:998;display:none;place-items:center;padding:24px;
    background:rgba(5,6,8,0.72);backdrop-filter:blur(14px);
  }
  .audio-gate.show{display:grid;}
  .audio-panel{
    width:min(440px,100%);border:1px solid var(--line-strong);background:rgba(17,16,19,0.92);
    padding:28px;box-shadow:0 28px 90px rgba(0,0,0,0.45);
  }
  .audio-panel .kicker{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);margin-bottom:14px;}
  .audio-panel h2{font-family:var(--font-display);font-size:clamp(24px,5vw,34px);line-height:1.05;font-weight:600;margin-bottom:14px;}
  .audio-panel p{color:var(--text-muted);font-size:var(--fs-body);line-height:1.65;margin-bottom:22px;}
  .audio-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .audio-actions button{
    border:1px solid var(--line-strong);background:transparent;color:var(--text);padding:12px 18px;
    font:600 12px var(--font-main);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    transition:background .25s ease,border-color .25s ease,color .25s ease;
  }
  .audio-actions .enable{background:var(--accent);border-color:var(--accent);color:#fff5f5;}
  .audio-actions button:hover{border-color:var(--accent-soft);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  /* ---------- nav ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:transparent;
    border-bottom:1px solid transparent;
    transition:border-color .4s ease;
  }
  header.scrolled{border-bottom-color:transparent;}
  nav.wrap{
    height:76px;display:flex;align-items:center;justify-content:space-between;
  }
  .brand{font-family:var(--font-display);font-weight:600;font-size:clamp(13px,3.6vw,16px);display:flex;align-items:center;gap:9px;cursor:pointer;}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim);}
  .navlinks{display:flex;gap:36px;font-size:var(--fs-small);color:var(--text-muted);}
  .navlinks a{position:relative;padding:4px 0;transition:color .25s ease;cursor:pointer;}
  .navlinks a:hover,.navlinks a.on{color:var(--text);}
  .navlinks a::after{
    content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--accent);
    transition:width .3s ease;
  }
  .navlinks a:hover::after,.navlinks a.on::after{width:100%;}
  .nav-cta{
    font-size:var(--fs-small);border:1px solid var(--line-strong);padding:9px 18px;border-radius:0;
    transition:border-color .25s ease, background .25s ease;cursor:pointer;
  }
  .nav-cta:hover{border-color:var(--accent);background:var(--accent-dim);}
  @media(max-width:820px){ .navlinks{display:none;} }

  /* ---------- slides engine ---------- */
  #slidesViewport{
    position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;
  }

  /* ---------- scroll transitions ---------- */
  #transitionOverlay{
    position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden;
  }
  #transitionOverlay .t-bar{
    position:absolute;background:rgba(0,0,0,1);
  }
  #transitionOverlay .t-iris{
    position:absolute;inset:-10%;background:rgba(0,0,0,1);
    clip-path:circle(0% at 92% 9%);
  }
  .slide{
    position:absolute;inset:0;width:100%;height:100%;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding-bottom:64px;overflow:hidden;
    opacity:0;visibility:hidden;pointer-events:none;
    z-index:0;
  }
  .slide.active{opacity:1;visibility:visible;pointer-events:auto;z-index:1;}
  .slide-media{position:absolute;inset:0;z-index:-3;background:#000;}
  .slide-media video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(0.92) contrast(1.05) brightness(1.35);
  }
  .slide-overlay{
    position:absolute;inset:0;z-index:-2;
    background:
      linear-gradient(180deg, rgba(4,5,6,0.35) 0%, rgba(4,5,6,0.08) 30%, rgba(4,5,6,0.22) 62%, rgba(4,5,6,0.88) 100%),
      radial-gradient(120% 90% at 50% 100%, rgba(4,5,6,0.1), rgba(4,5,6,0.72) 85%);
  }
  .slide-grain{position:absolute;inset:0;z-index:-1;opacity:0.05;mix-blend-mode:overlay;pointer-events:none;}
  .hero-orbit{
    position:absolute;right:max(28px,8vw);top:18vh;z-index:0;width:clamp(190px,25vw,350px);aspect-ratio:1;
    border:1px solid rgba(138,3,3,0.36);border-radius:50%;pointer-events:none;opacity:.75;
  }
  .hero-orbit::before,.hero-orbit::after{
    content:"";position:absolute;inset:12%;border:1px solid rgba(234,230,220,0.09);border-radius:50%;
  }
  .hero-orbit::after{inset:34%;background:radial-gradient(circle, rgba(138,3,3,0.34), transparent 58%);}
  .orbit-node{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent-soft);box-shadow:0 0 28px rgba(193,18,31,0.9);}
  .orbit-node.n1{left:50%;top:-5px;}
  .orbit-node.n2{right:10%;bottom:18%;}
  .orbit-node.n3{left:8%;bottom:24%;}

  .scroll-cue{position:absolute;left:32px;bottom:22px;z-index:3;display:flex;align-items:center;gap:12px;color:var(--text-dim);transition:opacity .3s ease;}
  .scroll-cue .stem{width:1px;height:44px;background:linear-gradient(180deg,var(--accent),transparent);}
  .scroll-cue span{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:0.18em;writing-mode:vertical-rl;text-transform:uppercase;}
  @media(max-width:640px){ .scroll-cue{display:none;} }

  .slide-inner{position:relative;z-index:1;padding-top:180px;}
  .kicker{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:0.14em;color:var(--accent-soft);text-transform:uppercase;margin-bottom:16px;}
  .slide-title{
    font-family:var(--font-display);font-weight:600;
    font-size:clamp(28px,8vw,84px);line-height:1.08;letter-spacing:0.01em;
    max-width:22ch;text-shadow:0 4px 40px rgba(0,0,0,0.5);
  }
  .slide-desc{margin-top:22px;font-size:var(--fs-body-lg);color:var(--text-muted);max-width:56ch;line-height:1.65;}
  .slide-desc strong{color:var(--text);font-weight:600;}
  .slide-extra{margin-top:32px;}

  .hero-actions{display:flex;gap:16px;flex-wrap:wrap;}
  .btn-primary{
    background:var(--accent);color:#fff5f5;font-size:var(--fs-small);font-weight:600;
    letter-spacing:0.04em;text-transform:uppercase;
    padding:15px 28px;border-radius:0;display:inline-flex;align-items:center;gap:8px;
    transition:transform .35s cubic-bezier(.2,.9,.25,1), background .3s ease;cursor:pointer;border:none;font-family:var(--font-main);
  }
  .btn-primary:hover{transform:translateY(-2px);background:var(--accent-soft);}
  .btn-ghost{
    border:1px solid var(--line-strong);font-size:var(--fs-small);color:var(--text-muted);
    letter-spacing:0.04em;text-transform:uppercase;
    padding:15px 28px;border-radius:0;transition:.3s ease;cursor:pointer;background:transparent;font-family:var(--font-main);
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--accent);}

  .highlight-list{display:grid;grid-template-columns:1fr 1fr;gap:22px 44px;max-width:900px;}
  .highlight-item{display:grid;grid-template-columns:24px 1fr;gap:14px;}
  .highlight-item .tick{color:var(--accent-soft);font-family:var(--font-mono);font-size:var(--fs-micro);padding-top:3px;}
  .highlight-item h4{font-family:var(--font-display);font-size:clamp(14.5px,3.8vw,17px);font-weight:600;color:var(--text);margin-bottom:5px;}
  .highlight-item p{font-size:clamp(12.5px,3.2vw,13.5px);color:var(--text-muted);line-height:1.55;}
  .highlight-item .meta{font-family:var(--font-mono);font-size:clamp(10px,2.6vw,11px);color:var(--accent-soft);margin-top:8px;letter-spacing:.02em;}
  .highlight-item .plink{font-size:var(--fs-small);display:inline-flex;align-items:center;gap:6px;color:var(--text);margin-top:10px;}
  @media(max-width:760px){ .highlight-list{grid-template-columns:1fr;} }

  .contact-links{display:flex;gap:18px;flex-wrap:wrap;}
  .contact-links a{
    font-size:var(--fs-small);border:1px solid var(--line-strong);padding:13px 24px;border-radius:0;
    transition:.3s ease;
  }
  .contact-links a:hover{border-color:var(--accent);background:var(--accent-dim);color:var(--text);}
  .contact-foot{margin-top:34px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);}

  [data-magnetic]{will-change:transform;}

  /* ---------- sound toggle ---------- */
  #soundToggle{
    position:fixed;right:28px;bottom:28px;z-index:60;
    width:52px;height:52px;border:1px solid var(--line-strong);
    background:rgba(7,8,10,0.55);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:border-color .3s ease, background .3s ease;
  }
  #soundToggle:hover{border-color:var(--accent);background:rgba(7,8,10,0.8);}
  #soundToggle svg{width:20px;height:20px;stroke:var(--text-muted);}
  #soundToggle.on svg{stroke:var(--accent-soft);}
  #soundToggle .muted-line{display:none;}
  #soundToggle.muted .muted-line{display:block;}
  #soundToggle.muted .wave-line{display:none;}

  footer{border-top:1px solid var(--line);padding:14px 0;font-size:var(--fs-micro);color:var(--text-dim);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
    .cursor-aura{display:none;}
  }

  /* ---------- phone-view polish ---------- */
  @media(max-width:760px){
    .wrap{padding:0 20px;}
    nav.wrap{height:64px;}
    .brand{font-size:14px;}
    .brand .dot{width:6px;height:6px;}
    .nav-cta{padding:8px 14px;font-size:11.5px;}

    .slide{padding-bottom:22px;}
    .slide-inner{
      padding-top:96px;
      max-height:100dvh;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .slide-inner::-webkit-scrollbar{display:none;}
    .slide-title{font-size:clamp(30px,9vw,46px);max-width:16ch;}
    .slide-desc{font-size:14px;margin-top:14px;}
    .kicker{margin-bottom:10px;}
    .slide-extra{margin-top:20px;}

    .highlight-list{gap:16px;}
    .highlight-item h4{font-size:15.5px;}
    .hero-actions{gap:10px;}
    .btn-primary,.btn-ghost{padding:13px 20px;font-size:11.5px;}

    .contact-links{gap:10px;}
    .contact-links a{padding:11px 16px;font-size:12.5px;}
    .contact-foot{margin-top:24px;}

    .hero-orbit{display:none;}

    #soundToggle{
      width:44px;height:44px;
      right:calc(14px + env(safe-area-inset-right));
      bottom:calc(14px + env(safe-area-inset-bottom));
    }
  }
  @media(max-width:400px){
    .slide-title{font-size:clamp(27px,10vw,36px);}
    .highlight-item{grid-template-columns:20px 1fr;gap:10px;}
  }
</style>
</head>
<body>

<div class="cursor-aura" id="cursorAura"></div>

<div id="preloader">
  <div class="mark hf" id="preloaderMark">JAY KAPADIYA</div>

</div>

<div class="audio-gate" id="audioGate" role="dialog" aria-modal="true" aria-labelledby="audioGateTitle">

      <a data-goto="projects">Projects</a>
      <a data-goto="skills">Skills</a>
      <a data-goto="contact">Contact</a>
    </div>
    <a class="nav-cta" data-magnetic data-goto="contact">Say hello</a>
  </nav>
</header>

<div id="slidesViewport"></div>
<div id="transitionOverlay" aria-hidden="true"></div>

<audio id="bgAudio" preload="auto">
  <source src="Elden_Ring_Main_Theme__The_Final_Battle___EPIC_VERSION.mp3" type="audio/mpeg">
</audio>

<button id="soundToggle" class="on" aria-label="Toggle sound">
  <svg class="wave-line" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 8 8 8 12 4 12 20 8 16 4 16" fill="none"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
  <svg class="muted-line" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 8 8 8 12 4 12 20 8 16 4 16" fill="none"/><line x1="16" y1="9" x2="21" y2="14"/><line x1="21" y1="9" x2="16" y2="14"/></svg>
</button>

<script>
/* =========================================================================
   SECTION DATA — this is the only thing you need to touch to add sections.
   Each entry needs: key, kicker, title, desc, and a `type` that decides
   which extra block renders (hero / tags / highlights / projects / skills
   / cards / contact). `video` is optional — omit it and it will cycle
   through the 3 available videos automatically.
   ========================================================================= */
const VIDEO_CYCLE = ['hero-video.mp4', 'Maliketh.mp4','rennala.mp4','Radahn_and_malenia.mp4', 'mareeka_and_radagon.mp4', 'Rodrik.mp4', 'Godfrey.mp4'];

const SECTIONS = [
  {
    key: 'hero', type: 'hero',
    poster: 'hero-poster.jpg',
    kicker: 'PORTFOLIO — 2026',
    title: 'Jay Kapadiya',
    desc: 'AI systems, backend infrastructure, and deployment pipelines built to survive production.',
    ctas: [
      { label: 'View projects', goto: 'projects', style: 'primary' },
      { label: 'Get in touch', goto: 'contact', style: 'ghost' }
    ]
  },
  {
    key: 'about', type: 'tags',
    kicker: 'CHAPTER I — ORIGIN',
    title: 'Backend-first,<br>AI-native.',
    desc: 'Software Engineer with a <strong>B.Tech in AI &amp; Data Science</strong> (top 10% of my batch), building production Python services with <strong>FastAPI</strong> and <strong>LangChain/LangGraph</strong> — deployed on real infrastructure, not notebooks. I also write <strong>Ansible</strong> and <strong>GitHub Actions</strong> pipelines; a WhatsApp bot shipped this way has held <strong>99% uptime</strong> in production.',
    tags: ['Mumbai, India', 'LLM systems / backend', 'Python · FastAPI', 'Docker · Ansible · GCP', 'Chairperson, SDS', 'Open to work']
  },
  {
    key: 'experience', type: 'highlights',
    kicker: 'CHAPTER II — THE FORGE',
    title: "Where I've built.",
    desc: '<strong>AI Engineer Intern</strong> — FoodNest(s) Technology Limited, Mumbai · Jan – Jul 2026',
    items: [
      { t: 'Infra & deployment automation', d: 'Ansible playbooks + GitHub Actions CI/CD — 99% uptime.' },
      { t: 'WhatsApp sales bot', d: 'FastAPI + LangGraph, 1,000+ orders & messages a month.' },
      { t: 'Meeting bot', d: 'LangGraph assistant — live fact-checking, tool-calling.' },
      { t: 'Cross-functional debugging', d: 'App logic, API integrations, and infra, end to end.' }
    ]
  },
  {
    key: 'projects', type: 'projects',
    kicker: "CHAPTER III — WHAT I'VE BUILT",
    title: "Things I've built<br>on my own time.",
    desc: 'Full source on GitHub.',
    items: [
      { name: 'Repo Blueprint', d: 'Clones a GitHub repo and generates a 15-section architecture report — a map-reduce FastAPI pipeline plus a Chroma-backed RAG endpoint for cited follow-up Q&amp;A.', tags: ['FastAPI', 'RAG', 'Chroma', 'async'], href: 'https://github.com/jaykapadiya2004/REPO-BLUEPRINT' },
      { name: 'Dog-Vision', d: 'A TensorFlow image classifier using transfer learning to tell apart 120 dog breeds across 10,000 images — 93% test accuracy.', tags: ['TensorFlow', 'Transfer learning', 'Computer vision'], href: 'https://github.com/jaykapadiya2004/Dog-Vision' }
    ]
  },
  {
    key: 'skills', type: 'skills',
    kicker: 'CHAPTER IV — THE ARSENAL',
    title: 'What I work with.',
    desc: 'Grouped by where it sits in the system, not just a tag cloud.',
    groups: [
      { h: 'Languages', items: ['Python', 'SQL', 'C++'] },
      { h: 'Backend & AI', items: ['FastAPI', 'LangChain / LangGraph', 'Agentic workflows'] },
      { h: 'DevOps & infra', items: ['Docker', 'Ansible', 'CI/CD', 'Hetzner · GCP'] },
      { h: 'ML & data', items: ['Deep learning · NLP', 'TensorFlow · scikit-learn', 'Tableau · Power BI'] }
    ]
  },
  {
    key: 'education', type: 'cards',
    kicker: 'CHAPTER V — PROVENANCE',
    title: 'Education &amp; recognition.',
    desc: '',
    items: [
      { big: '9.06', h: 'B.Tech, AI &amp; Data Science', lines: ['Thakur College of Engineering, Mumbai — 2022–2026', 'Top 10% of the batch'] },
      { h: 'Certifications', lines: ['NPTEL — Python / DSA', 'Google — Automation with Python', 'TensorFlow Developer Bootcamp'] },
      { h: 'Leadership &amp; awards', lines: ['Chairperson, Society for Data Science', 'Gold Medalist, Multicon'] }
    ]
  },
  {
    key: 'contact', type: 'contact',
    kicker: 'CHAPTER VI — THE CALL',
    title: "Let's build systems<br>worth trusting.",
    desc: 'Open to AI/ML engineering and backend roles where a system actually has to run in production, not just in a notebook.',
    links: [
      { label: 'jaykapadiya2004@gmail.com', href: 'mailto:jaykapadiya2004@gmail.com' },
      { label: '+91 94718 99901', href: 'tel:+919471899901' },
      { label: 'GitHub', href: 'https://github.com/jaykapadiya2004' }
    ]
  }
];

/* =========================================================================
   RENDERING — builds one full-screen slide per SECTIONS entry.
   ========================================================================= */
function extraHTML(sec){
  switch(sec.type){
    case 'hero':
      return `<div class="hero-actions slide-extra">${sec.ctas.map(c =>
        `<a class="btn-${c.style}" data-goto="${c.goto}" data-magnetic>${c.label}</a>`
      ).join('')}</div>`;
    case 'tags':
      return `<div class="highlight-list slide-extra">${sec.tags.map((t,i) =>
        `<div class="highlight-item"><div class="tick">0${i+1}</div><div><p>${t}</p></div></div>`
      ).join('')}</div>`;
    case 'highlights':
      return `<div class="highlight-list slide-extra">${sec.items.map((it,i) =>
        `<div class="highlight-item"><div class="tick">0${i+1}</div><div><h4>${it.t}</h4><p>${it.d}</p></div></div>`
      ).join('')}</div>`;
    case 'projects':
      return `<div class="highlight-list slide-extra">${sec.items.map((p,i) => `
        <div class="highlight-item">
          <div class="tick">0${i+1}</div>
          <div>
            <h4>${p.name}</h4>
            <p>${p.d}</p>
            <p class="meta">${p.tags.join(' · ')}</p>
            <a class="plink" href="${p.href}" target="_blank" rel="noopener">View on GitHub ↗</a>
          </div>
        </div>`).join('')}</div>`;
    case 'skills':
      return `<div class="highlight-list slide-extra">${sec.groups.map((g,i) =>
        `<div class="highlight-item"><div class="tick">0${i+1}</div><div><h4>${g.h}</h4><p>${g.items.join(' · ')}</p></div></div>`
      ).join('')}</div>`;
    case 'cards':
      return `<div class="highlight-list slide-extra">${sec.items.map((c,i) => `
        <div class="highlight-item">
          <div class="tick">0${i+1}</div>
          <div>
            <h4>${c.big ? c.big + ' — ' : ''}${c.h}</h4>
            ${c.lines.map(l => `<p>${l}</p>`).join('')}
          </div>
        </div>`).join('')}</div>`;
    case 'contact':
      return `<div class="slide-extra">
        <div class="contact-links">${sec.links.map(l => `<a href="${l.href}" target="${l.href.startsWith('http')?'_blank':'_self'}" rel="noopener" data-magnetic>${l.label}</a>`).join('')}</div>
        <div class="contact-foot mono">© 2026 Jay Kapadiya — built with fastapi energy, shipped as html</div>
      </div>`;
    default: return '';
  }
}

function buildSlide(sec, index){
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.dataset.key = sec.key;
  slide.dataset.index = index;

  const video = sec.video || VIDEO_CYCLE[index % VIDEO_CYCLE.length];
  const isHero = sec.key === 'hero';

  slide.innerHTML = `
    <div class="slide-media">
      <video ${sec.poster ? `poster="${sec.poster}"` : ''} muted loop playsinline preload="${index<=1?'auto':'metadata'}">
        <source src="${video}" type="video/mp4">
      </video>
    </div>
    <div class="slide-overlay"></div>
    <svg class="slide-grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grain-${index}"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#grain-${index})"/>
    </svg>
    ${isHero ? `
      <div class="hero-orbit" aria-hidden="true">
        <span class="orbit-node n1"></span><span class="orbit-node n2"></span><span class="orbit-node n3"></span>
      </div>` : ''}
    <div class="scroll-cue"><div class="stem"></div><span>Scroll</span></div>
    <div class="wrap slide-inner">
      <div class="kicker mono">${sec.kicker}</div>
      <h1 class="slide-title">${sec.title}</h1>
      ${sec.desc ? `<p class="slide-desc">${sec.desc}</p>` : ''}
      ${extraHTML(sec)}
    </div>
  `;
  return slide;
}

const viewport = document.getElementById('slidesViewport');
const slideEls = SECTIONS.map((sec, i) => {
  const el = buildSlide(sec, i);
  viewport.appendChild(el);
  return el;
});
const keyToIndex = {};
SECTIONS.forEach((s, i) => keyToIndex[s.key] = i);

/* =========================================================================
   TRANSITION ENGINE — every scroll/click swaps sections behind a black,
   translucent stepped wipe (inspired by a shutter/blinds reveal). Each
   section gets its own wipe signature — axis, stagger origin, easing,
   sometimes a skew — so no two sections transition in quite the same way.
   The wipe never goes fully opaque, so the outgoing frame still ghosts
   through right up until the swap, and the incoming video is at full
   clarity the instant the bars clear.
   ========================================================================= */
let current = 0;
let locked = false;
const total = SECTIONS.length;

const transitionOverlay = document.getElementById('transitionOverlay');

/* One distinct wipe recipe per section key. `axis` picks vertical bars
   (columns filling top→down) or horizontal bars (rows filling side→side).
   `coverFrom` / `revealFrom` are GSAP stagger origins ('start','end',
   'center','edges') — using a different origin for the reveal than the
   cover is what keeps each pass from feeling like a mirror image of itself. */
const TRANSITIONS = {
  hero:       { axis:'y', bars:11, coverFrom:'edges',  revealFrom:'center', skew:0  },
  about:      { axis:'x', bars:9,  coverFrom:'start',  revealFrom:'end',    skew:0  },
  experience: { axis:'y', bars:13, coverFrom:'start',  revealFrom:'start',  skew:-6 },
  projects:   { axis:'x', bars:11, coverFrom:'center', revealFrom:'edges',  skew:0  },
  skills:     { axis:'y', bars:9,  coverFrom:'end',     revealFrom:'end',   skew:0  },
  education:  { type:'iris' },
  contact:    { axis:'y', bars:15, coverFrom:'start',  revealFrom:'start',  skew:-8 }
};

function buildBars(cfg){
  transitionOverlay.innerHTML = '';
  const n = cfg.bars;
  const vertical = cfg.axis === 'y';
  const bars = [];
  for (let i = 0; i < n; i++){
    const b = document.createElement('div');
    b.className = 't-bar';
    if (vertical){
      b.style.left = (i * 100 / n) + '%';
      b.style.top = '0';
      b.style.width = (100 / n + 0.6) + '%';
      b.style.height = '100%';
    } else {
      b.style.top = (i * 100 / n) + '%';
      b.style.left = '0';
      b.style.height = (100 / n + 0.6) + '%';
      b.style.width = '100%';
    }
    transitionOverlay.appendChild(b);
    bars.push(b);
  }
  return bars;
}

function runBarsTransition(cfg, newIndex){
  return new Promise((resolve) => {
    const bars = buildBars(cfg);
    const vertical = cfg.axis === 'y';
    const scaleProp = vertical ? 'scaleY' : 'scaleX';
    const skewProp = vertical ? 'skewX' : 'skewY';
    const originIn = vertical ? 'top' : 'left';
    const originOut = vertical ? 'bottom' : 'right';

    gsap.set(bars, { [scaleProp]: 0, transformOrigin: originIn, [skewProp]: 0 });

    gsap.to(bars, {
      [scaleProp]: 1,
      [skewProp]: cfg.skew,
      duration: 0.55,
      ease: 'power2.in',
      stagger: { each: 0.42 / cfg.bars, from: cfg.coverFrom },
      onComplete(){
        activateSlide(newIndex);
        gsap.set(bars, { transformOrigin: originOut });
        gsap.to(bars, {
          [scaleProp]: 0,
          [skewProp]: 0,
          duration: 0.6,
          ease: 'power3.out',
          stagger: { each: 0.42 / cfg.bars, from: cfg.revealFrom },
          onComplete(){
            transitionOverlay.innerHTML = '';
            resolve();
          }
        });
      }
    });
  });
}

function runIrisTransition(newIndex){
  return new Promise((resolve) => {
    transitionOverlay.innerHTML = '<div class="t-iris"></div>';
    const iris = transitionOverlay.querySelector('.t-iris');
    gsap.set(iris, { clipPath: 'circle(0% at 92% 9%)' });
    gsap.to(iris, {
      clipPath: 'circle(145% at 92% 9%)',
      duration: 0.62,
      ease: 'power3.inOut',
      onComplete(){
        activateSlide(newIndex);
        gsap.set(iris, { clipPath: 'circle(145% at 8% 91%)' });
        gsap.to(iris, {
          clipPath: 'circle(0% at 8% 91%)',
          duration: 0.62,
          ease: 'power3.inOut',
          onComplete(){
            transitionOverlay.innerHTML = '';
            resolve();
          }
        });
      }
    });
  });
}

function runTransition(newIndex){
  const cfg = TRANSITIONS[SECTIONS[newIndex].key] || TRANSITIONS.hero;
  return cfg.type === 'iris' ? runIrisTransition(newIndex) : runBarsTransition(cfg, newIndex);
}

/* Force a video to start fetching real data (not just metadata) ahead of
   the slide actually becoming visible, so it's already buffered by the
   time the user scrolls to it. Safe to call repeatedly / on already-
   loaded videos — it's a no-op past the first call per video. */
function preloadVideo(index){
  if (index < 0 || index >= total) return;
  const v = slideEls[index].querySelector('video');
  if (!v || v.dataset.primed) return;
  v.dataset.primed = '1';
  v.preload = 'auto';
  v.load();
}

function playVideo(el){
  const v = el.querySelector('video');
  if (!v) return;
  const start = () => { v.currentTime = 0; v.play().catch(() => {}); };
  /* readyState >= 3 (HAVE_FUTURE_DATA) means it can play through the
     current frame without an immediate stall. If it's not there yet,
     wait for 'canplay' instead of forcing play on an empty buffer —
     that stall/catch-up is the lag you're seeing. */
  if (v.readyState >= 3) {
    start();
  } else {
    v.preload = 'auto';
    v.addEventListener('canplay', start, { once: true });
    if (v.readyState === 0) v.load();
  }
}
function pauseVideo(el){
  const v = el.querySelector('video');
  if (v) v.pause();
}

function activateSlide(newIndex){
  slideEls.forEach((el, i) => {
    if (i === newIndex) { el.classList.add('active'); playVideo(el); }
    else { el.classList.remove('active'); pauseVideo(el); }
  });
  /* Warm up the videos on either side of the new slide so the *next*
     scroll (in either direction) doesn't hit an unbuffered video. */
  preloadVideo(newIndex + 1);
  preloadVideo(newIndex - 1);
}

function updateChrome(){
  document.getElementById('siteHeader').classList.toggle('scrolled', current > 0);
  document.querySelectorAll('.navlinks a').forEach(a => {
    a.classList.toggle('on', keyToIndex[a.dataset.goto] === current);
  });
  slideEls[current].querySelector('.scroll-cue').style.opacity = current === total - 1 ? '0' : '1';
}

function transitionTo(newIndex){
  if (locked || newIndex === current || newIndex < 0 || newIndex >= total) return;
  locked = true;
  current = newIndex;
  updateChrome();
  runTransition(newIndex).then(() => { locked = false; });
}

/* first slide is already "active" with no transition needed */
activateSlide(0);
updateChrome();

/* =========================================================================
   INPUT — wheel, touch, keyboard. Debounced so one gesture = one section.
   ========================================================================= */
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (locked || Math.abs(e.deltaY) < 4) return;
  transitionTo(current + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

/* On phones a section's text can be taller than the viewport, so
   .slide-inner is allowed to scroll internally there (see CSS). These
   helpers let a swipe scroll that inner content first, and only change
   sections once the user has hit the top/bottom of it. */
function scrollableAncestor(el){
  return el && el.closest ? el.closest('.slide-inner') : null;
}
function atScrollBoundary(el, dy){
  if (!el || el.scrollHeight <= el.clientHeight + 1) return true;
  if (dy > 0) return el.scrollTop + el.clientHeight >= el.scrollHeight - 1; // swiping up / scrolling further down
  return el.scrollTop <= 0; // swiping down / scrolling further up
}

let touchStartY = null;
let touchScrollEl = null;
window.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchScrollEl = scrollableAncestor(e.target);
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (touchScrollEl) {
    const dy = touchStartY - e.touches[0].clientY;
    if (!atScrollBoundary(touchScrollEl, dy)) return; // let the panel scroll natively
  }
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', (e) => {
  if (touchStartY === null || locked) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  const scrollEl = touchScrollEl;
  touchStartY = null;
  touchScrollEl = null;
  if (Math.abs(dy) < 40) return;
  if (scrollEl && !atScrollBoundary(scrollEl, dy)) return;
  transitionTo(current + (dy > 0 ? 1 : -1));
}, { passive: true });

window.addEventListener('keydown', (e) => {
  if (locked) return;
  if (['ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); transitionTo(current + 1); }
  if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); transitionTo(current - 1); }
});

document.querySelectorAll('[data-goto]').forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const idx = keyToIndex[el.dataset.goto];
    if (idx !== undefined) transitionTo(idx);
  });
});

/* Tap/click navigation: right side of the screen = next section (scroll
   down), left side = previous section (scroll up). Ignored on real
   links/buttons (which already have their own behaviour) and while the
   preloader or audio gate is covering the screen. */
const preloaderEl = document.getElementById('preloader');
document.addEventListener('click', (e) => {
  if (locked) return;
  if (preloaderEl.style.display !== 'none') return;
  if (audioGate.classList.contains('show')) return;
  if (e.target.closest('a, button, [data-goto], [data-magnetic], header, #soundToggle')) return;
  const isRight = e.clientX > window.innerWidth / 2;
  transitionTo(current + (isRight ? 1 : -1));
});

/* =========================================================================
   PRELOADER + HERO INTRO
   ========================================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function playHeroIntro(){
  if (!reduceMotion) {
    gsap.to('.hero-orbit', { rotate: 360, duration: 34, ease: 'none', repeat: -1 });
    gsap.to('.orbit-node', { scale: 1.65, opacity: 0.55, duration: 1.35, yoyo: true, repeat: -1, stagger: 0.28, ease: 'sine.inOut' });
  }
  showAudioGate();
}

if (reduceMotion) {
  document.getElementById('preloader').style.display = 'none';
  playHeroIntro();
} else {
  const tl = gsap.timeline({
    onComplete: () => {
      gsap.to('#preloader', {
        opacity: 0, duration: 0.75, ease: 'power2.inOut',
        onComplete: () => document.getElementById('preloader').style.display = 'none'
      });
      playHeroIntro();
    }
  });
  tl.to('#preloaderMark', { opacity: 1, duration: 0.9, ease: 'power2.out' })
    .to('#preloaderRule', { width: '160px', duration: 0.64, ease: 'power2.out' }, '-=0.26')
    .to({}, { duration: 0.38 });
}

/* =========================================================================
   SOUND TOGGLE — controls the background music track only. Slide videos
   always stay muted (they're purely visual across the cycling clips).
   ========================================================================= */
const soundBtn = document.getElementById('soundToggle');
const bgAudio = document.getElementById('bgAudio');
const audioGate = document.getElementById('audioGate');
const enableAudio = document.getElementById('enableAudio');
const skipAudio = document.getElementById('skipAudio');
let soundOn = false;
const bgAudioStart = 11;
bgAudio.volume = 0;
function syncSoundButton(){
  soundBtn.classList.toggle('muted', !soundOn);
  soundBtn.classList.toggle('on', soundOn);
}
function showAudioGate(){
  if (sessionStorage.getItem('audioGateSeen') === 'true') return;
  audioGate.classList.add('show');
  gsap.fromTo('.audio-panel', { opacity: 0, y: 24, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'power3.out' });
}
function closeAudioGate(){
  sessionStorage.setItem('audioGateSeen', 'true');
  gsap.to('.audio-panel', {
    opacity: 0, y: 14, scale: 0.98, duration: 0.24, ease: 'power2.in',
    onComplete: () => audioGate.classList.remove('show')
  });
}
function startBackgroundAudio(){
  if (bgAudio.currentTime < bgAudioStart) bgAudio.currentTime = bgAudioStart;
  return bgAudio.play().then(() => {
    soundOn = true;
    syncSoundButton();
    gsap.to(bgAudio, { volume: 0.3, duration: 1.4, ease: 'power2.out' });
  }).catch(() => {
    soundOn = false;
    syncSoundButton();
  });
}
bgAudio.addEventListener('loadedmetadata', () => {
  if (bgAudio.currentTime < bgAudioStart) bgAudio.currentTime = bgAudioStart;
});
bgAudio.addEventListener('ended', () => {
  bgAudio.currentTime = bgAudioStart;
  bgAudio.play().catch(() => {});
});
enableAudio.addEventListener('click', () => { startBackgroundAudio(); closeAudioGate(); });
skipAudio.addEventListener('click', () => { soundOn = false; syncSoundButton(); closeAudioGate(); });
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  syncSoundButton();
  if (soundOn) startBackgroundAudio();
  else gsap.to(bgAudio, { volume: 0, duration: 0.7, ease: 'power2.out', onComplete: () => bgAudio.pause() });
});
syncSoundButton();

/* cursor glow */
const aura = document.getElementById('cursorAura');
if (!reduceMotion && window.matchMedia('(pointer:fine)').matches) {
  const moveX = gsap.quickTo(aura, 'x', { duration: 0.42, ease: 'power3.out' });
  const moveY = gsap.quickTo(aura, 'y', { duration: 0.42, ease: 'power3.out' });
  window.addEventListener('pointermove', e => {
    moveX(e.clientX);
    moveY(e.clientY);
    gsap.to(aura, { opacity: 1, duration: 0.28 });
  });
  document.addEventListener('mouseleave', () => gsap.to(aura, { opacity: 0, duration: 0.3 }));
}
</script>

<script type="module">
import { animate, press } from 'https://cdn.jsdelivr.net/npm/motion@12/+esm';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduceMotion) {
  animate('.scroll-cue .stem', { scaleY: [0.2, 1, 0.2], opacity: [0.35, 1, 0.35] }, { duration: 1.8, repeat: Infinity, easing: 'ease-in-out' });

  press('.btn-primary, .btn-ghost, .nav-cta, .contact-links a', element => {
    animate(element, { scale: 0.965 }, { duration: 0.12 });
    return () => animate(element, { scale: 1 }, { duration: 0.28, easing: [0.16, 1, 0.3, 1] });
  });
}
</script>
